<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b1a12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phase4.css">
  <!-- Apply saved dark mode before first paint (no flash) -->
  <script>try{if(JSON.parse(localStorage.getItem("kkopi_settings")).dark)document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <title>Order History | KKOPI.Tea</title>
</head>
<body data-page="orders">
  <header class="nav">
    <div class="container nav-in">
      <a class="logo" href="../home.html">KKOPI<span>.Tea</span></a>
      <nav class="nav-links" aria-label="Main">
        <a class="pill" href="../home.html">Home</a>
        <a class="pill" href="../phase2/menuphase2.html">Menu</a>
      </nav>
      <div class="nav-actions">
        <a class="icon-btn" href="../phase3/cartphase3.html" aria-label="Cart">🛒<span class="badge" id="cartCount" hidden>0</span></a>
        <a class="icon-btn active" href="profilephase4.html" aria-label="Profile">👤</a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Order History</h1>
    <nav class="tabs" aria-label="Account"><a class="tab" href="profilephase4.html">Profile</a><a class="tab" href="favoritesphase4.html">Favorites</a><a class="tab active" href="orderhistoryphase4.html" aria-current="page">Orders</a><a class="tab" href="settingsphase4.html">Settings</a></nav>

    <div class="orders" id="orderList"></div>

    <!-- Empty state -->
    <section class="empty glass" id="orderEmpty" hidden>
      <svg viewBox="0 0 120 130" width="120" role="img" aria-label="Empty receipt">
        <path d="M24 8h72v110l-12-8-12 8-12-8-12 8-12-8-12 8z" fill="#eadbc8" stroke="#6f4a32" stroke-width="3" stroke-linejoin="round"/>
        <path d="M40 34h40M40 52h40M40 70h24" stroke="#6f4a32" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h2>No orders yet</h2>
      <p>Your past orders will show up here.</p>
      <a class="btn" href="../phase2/menuphase2.html">Browse Menu</a>
    </section>

    <div class="footer-actions"><a class="btn btn-ghost" href="../home.html">Back Home</a></div>
  </main>

  <script src="phase4.js"></script>
</body>
</html>
