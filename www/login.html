<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Login | KKOPI.Tea</title>
  </head>
  <body data-page="login">
    <main class="auth">
      <div class="auth-card glass">
        <a class="logo" href="index.html">KKOPI<span>.Tea</span></a>
        <h1>Welcome back</h1>
        <p class="sub">Log in to order your favorite milk tea.</p>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              data-rule="email"
              autocomplete="email"
            />
            <div class="error"></div>
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              id="password"
              name="password"
              type="password"
              data-rule="password"
              autocomplete="current-password"
            />
            <div class="error"></div>
          </div>
          <div class="row">
            <label><input type="checkbox" id="remember" /> Remember me</label
            ><a class="link" href="forgot.html">Forgot password?</a>
          </div>
          <button class="btn btn-light btn-block" type="submit">Log in</button>
        </form>
        <p class="switch">
          New here? <a class="link" href="register.html">Create account</a>
        </p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
