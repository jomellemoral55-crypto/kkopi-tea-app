<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b1a12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="phase5.css" />
    <title>Admin Login | KKOPI.Tea</title>
  </head>
  <body data-page="login" class="auth">
    <main class="login-card glass">
      <a class="logo" href="../home.html">KKOPI<span>.Tea</span></a>
      <h1>Admin Login</h1>
      <p class="sub">Sign in to manage products, orders and customers.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Admin email</label
          ><input
            id="email"
            name="email"
            type="email"
            data-rule="email"
            autocomplete="username"
          />
          <p class="error"></p>
        </div>
        <div class="field">
          <label for="password">Password</label
          ><input
            id="password"
            name="password"
            type="password"
            data-rule="password"
            autocomplete="current-password"
          />
          <p class="error"></p>
        </div>
        <div class="row">
          <label><input type="checkbox" id="showPw" /> Show password</label>
          <a class="link" href="../forgot.html">Forgot password?</a>
        </div>
        <div class="row">
          <label><input type="checkbox" id="remember" /> Remember me</label>
        </div>
        <p class="form-error" id="formError" role="alert" hidden></p>
        <button class="btn btn-light btn-block" type="submit" id="loginBtn">
          Login
        </button>
      </form>
      <p class="hint">
        Demo account: <strong>admin@kkopi.tea</strong> /
        <strong>admin123</strong>
      </p>
      <p class="switch">
        <a class="link" href="../home.html">&larr; Back to Home</a>
      </p>
    </main>
    <script src="phase5.js"></script>
  </body>
</html>
