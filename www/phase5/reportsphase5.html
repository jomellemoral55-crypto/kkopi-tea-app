<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b1a12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="phase5.css" />
    <title>Reports | KKOPI.Tea Admin</title>
  </head>
  <body data-page="reports" class="app">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
      <a class="logo" href="dashboardphase5.html"
        >KKOPI<span>.Tea</span><small>Admin</small></a
      >
      <nav class="side-nav">
        <a class="nav-link" href="dashboardphase5.html"
          ><span aria-hidden="true">📊</span>Dashboard</a
        ><a class="nav-link" href="productsphase5.html"
          ><span aria-hidden="true">🥤</span>Products</a
        ><a class="nav-link" href="ordersphase5.html"
          ><span aria-hidden="true">🧾</span>Orders</a
        ><a class="nav-link" href="customersphase5.html"
          ><span aria-hidden="true">👥</span>Customers</a
        ><a
          class="nav-link active"
          href="reportsphase5.html"
          aria-current="page"
          ><span aria-hidden="true">📈</span>Reports</a
        >
      </nav>
      <div class="side-foot">
        <button class="nav-link logout" id="logoutBtn" type="button">
          <span aria-hidden="true">🚪</span>Logout
        </button>
        <button class="reset" id="resetDemo" type="button">
          Reset demo data
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <!-- ===== TOP NAVIGATION ===== -->
      <header class="topbar">
        <button
          class="icon-btn menu-btn"
          id="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>
        <label class="search"
          ><span aria-hidden="true">🔍</span
          ><input
            id="searchInput"
            type="search"
            placeholder="Search products..."
            aria-label="Search"
        /></label>
        <div class="top-actions">
          <div class="notif">
            <button
              class="icon-btn"
              id="notifBtn"
              type="button"
              aria-label="Notifications"
              aria-expanded="false"
            >
              🔔<span class="badge" id="notifCount" hidden>0</span>
            </button>
            <div class="notif-menu glass" id="notifMenu" hidden></div>
          </div>
          <div class="admin-chip">
            <span class="avatar-sm" id="adminInitial">A</span
            ><span class="admin-name" id="adminName">Admin</span>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="page-head">
          <h1>Reports</h1>
          <div class="head-actions">
            <button class="btn btn-ghost" id="exPdf" type="button">PDF</button
            ><button class="btn btn-ghost" id="exXls" type="button">
              Excel</button
            ><button class="btn" id="exCsv" type="button">CSV</button>
          </div>
        </div>

        <section
          class="cards"
          aria-label="Revenue summary"
          id="revCards"
        ></section>

        <div class="two-col">
          <section class="panel glass">
            <div class="panel-head">
              <h2>Sales</h2>
              <div
                class="seg"
                id="periodSeg"
                role="group"
                aria-label="Report period"
              >
                <button type="button" data-p="daily" class="on">Daily</button
                ><button type="button" data-p="weekly">Weekly</button
                ><button type="button" data-p="monthly">Monthly</button>
              </div>
            </div>
            <div class="chart" id="barChart"></div>
          </section>
          <section class="panel glass">
            <h2>Revenue by category</h2>
            <div class="pie-wrap" id="pieChart"></div>
          </section>
        </div>

        <div class="two-col">
          <section class="panel glass">
            <h2>Top selling products</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>Sold</th>
                    <th>Revenue</th>
                  </tr>
                </thead>
                <tbody id="topProducts"></tbody>
              </table>
            </div>
          </section>
          <section class="panel glass">
            <h2>Top customers</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Customer</th>
                    <th>Orders</th>
                    <th>Spent</th>
                  </tr>
                </thead>
                <tbody id="topCustomers"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="phase5.js"></script>
  </body>
</html>
